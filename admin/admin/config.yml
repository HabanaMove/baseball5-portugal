backend:
  name: github
  repo: HabanaMove_GITHUB/baseball5-portugal
  branch: main # O 'master', asegúrate de que coincide con el nombre de tu rama principal

media_folder: "assets/images" # Dónde se guardarán las imágenes que subas
public_folder: "/assets/images"

collections:
  - name: "noticias"
    label: "Noticias y Publicaciones"
    folder: "content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen principal", name: "image", widget: "image", required: false }
      - { label: "Cuerpo de la noticia", name: "body", widget: "markdown" }
